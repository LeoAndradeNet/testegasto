<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173b64">
  <title>Minhas Notinhas</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color:#162b40; background:#f3f6fa; font-size:17px; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; }
    header { background:#173b64; color:white; padding:23px 18px 27px; border-radius:0 0 24px 24px; }
    .header-inner { max-width:540px; margin:auto; display:flex; justify-content:space-between; align-items:center; gap:12px; }
    h1 { margin:0; font-size:27px; }
    header p { margin:4px 0 0; opacity:.85; font-size:14px; }
    main { max-width:540px; padding:18px 14px 48px; margin:auto; }
    .card { background:#fff; border-radius:19px; padding:19px; margin-bottom:15px; box-shadow:0 3px 14px rgba(0,0,0,.05); }
    h2 { font-size:19px; margin:0 0 15px; }
    button, input, select { font:inherit; }
    button { border:0; border-radius:13px; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .primary { width:100%; background:#1768cb; color:#fff; padding:17px; min-height:65px; font-size:21px; }
    .secondary { background:#e7eef7; color:#173b64; padding:13px 17px; min-height:51px; }
    .small { color:#fff; background:#ffffff22; border:1px solid #ffffff55; padding:9px 12px; white-space:nowrap; font-size:12px; }
    .submit { background:#173b64; color:white; min-height:56px; padding:0 18px; }
    .hint { color:#687a8a; text-align:center; font-size:14px; line-height:1.5; }
    label { display:block; font-size:15px; font-weight:650; margin-bottom:9px; }
    input, select { width:100%; min-height:55px; border:2px solid #d9e2ed; border-radius:12px; padding:11px; background:white; color:#162b40; font-size:16px; }
    input:focus, select:focus { outline:2px solid #a1c9ff; border-color:#1768cb; }
    .inline { display:flex; gap:9px; }
    .inline input { min-width:0; flex:1; }
    #cameraArea { display:none; margin-top:17px; }
    #reader { width:100%; min-height:230px; border-radius:15px; background:#121e29; overflow:hidden; }
    #reader video { width:100%!important; object-fit:cover; }
    .camera-actions { text-align:center; margin-top:12px; }
    #status { display:none; margin-bottom:15px; padding:15px; border-radius:13px; line-height:1.5; font-weight:600; overflow-wrap:anywhere; }
    #status.info { display:block; background:#e4f0ff; color:#194878; }
    #status.success { display:block; background:#e2f4e9; color:#176137; }
    #status.warning { display:block; background:#fff1d8; color:#785000; }
    #status.error { display:block; background:#ffebeb; color:#952626; }
    .hidden { display:none!important; }
    .shop { font-size:22px; font-weight:750; overflow-wrap:anywhere; }
    .date { color:#65788e; font-size:15px; margin-top:5px; }
    .total-box { margin:19px 0; padding:18px; border-radius:15px; background:#f0f6fd; }
    .total-box span { color:#576e87; font-size:14px; }
    .total-box strong { display:block; color:#1768cb; font-size:34px; margin-top:4px; }
    .item { display:flex; justify-content:space-between; gap:12px; padding:13px 0; border-bottom:1px solid #e8edf3; }
    .item:last-child { border:0; }
    .item-name { font-size:16px; font-weight:650; overflow-wrap:anywhere; }
    .item-detail { color:#67798a; font-size:14px; margin-top:5px; }
    .item-total { font-size:16px; font-weight:700; white-space:nowrap; }
    #categoryStatus { font-size:14px; min-height:20px; margin-top:9px; }
    .modal { position:fixed; inset:0; z-index:50; background:#091929d9; display:flex; align-items:center; justify-content:center; padding:20px; }
    .modal-box { background:#fff; width:100%; max-width:420px; padding:25px; border-radius:20px; }
    .modal-box h2 { font-size:24px; }
    .modal-box p { font-size:15px; color:#586b7e; line-height:1.5; }
    .modal-box input { margin-bottom:10px; }
    #passwordError { color:#a52929; font-size:14px; margin:0 0 10px; min-height:18px; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div><h1>🧾 Minhas Notinhas</h1><p>Seu controle de compras</p></div>
      <button type="button" id="changePassword" class="small">Trocar senha</button>
    </div>
  </header>
  <main>
    <section class="card">
      <h2>Adicionar uma compra</h2>
      <button type="button" class="primary" id="startCamera">📷 Ler notinha</button>
      <p class="hint">Aponte a câmera para o QR Code da nota fiscal.</p>
      <div id="cameraArea">
        <div id="reader"></div>
        <div class="camera-actions"><button type="button" class="secondary" id="stopCamera">Fechar câmera</button></div>
      </div>
    </section>
    <section class="card">
      <form id="linkForm">
        <label for="noteLink">Ou cole o link da nota</label>
        <div class="inline">
          <input id="noteLink" type="url" inputmode="url" placeholder="https://www.nfce..." autocomplete="off">
          <button type="submit" class="submit" id="submitNote">Lançar</button>
        </div>
      </form>
    </section>
    <div id="status" role="status" aria-live="polite"></div>
    <section class="card hidden" id="result" aria-live="polite">
      <h2>Compra encontrada</h2>
      <div id="shopName" class="shop"></div>
      <div id="purchaseDate" class="date"></div>
      <div class="total-box"><span>Total da compra</span><strong id="purchaseTotal"></strong></div>
      <label for="category">Categoria da loja</label>
      <select id="category">
        <option>Mercado</option>
        <option>Farmácia</option>
        <option>Combustível</option>
        <option>Restaurante</option>
        <option>Outros</option>
      </select>
      <div id="categoryStatus" aria-live="polite"></div>
      <h2 style="margin-top:25px">Itens da compra</h2>
      <div id="items"></div>
    </section>
  </main>
  <div id="passwordModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="passwordHeading">
    <div class="modal-box">
      <h2 id="passwordHeading">🔐 Senha do aplicativo</h2>
      <p>Digite a senha cadastrada no Apps Script. Ela ficará guardada neste navegador.</p>
      <form id="passwordForm">
        <label for="passwordInput">Senha</label>
        <input id="passwordInput" type="password" autocomplete="current-password" required>
        <div id="passwordError"></div>
        <button type="submit" class="primary">Salvar senha</button>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    // COLE A URL DA IMPLANTAÇÃO DO APPS SCRIPT, TERMINADA EM /exec
    const URL_DO_MOTOR = "https://script.google.com/macros/s/AKfycbzSI1_n837anX3CE4DXx3EFYrZ3YNid0EXalLdIVgbytYfJ6qPKfHfvZzAWIW0tvFQ/exec";

    const SENHA_STORAGE = "minhas_notinhas_senha";
    const URL_CONSULTA = "https://www.nfce.fazenda.sp.gov.br/NFCeConsultaPublica/Paginas/ConsultaQRCode.aspx";
    const CATEGORIAS = ["Mercado", "Farmácia", "Combustível", "Restaurante", "Outros"];
    const $ = id => document.getElementById(id);

    let senha = "";
    let scanner = null;
    let iniciandoCamera = false;
    let leituraRecebida = false;
    let processando = false;
    let lojaAtual = "";
    let categoriaAnterior = "Outros";
    let salvandoCategoria = false;

    function mensagem(texto, tipo = "info") {
      const el = $("status");
      el.className = tipo;
      el.textContent = texto;
    }

    function abrirSenha() {
      $("passwordError").textContent = "";
      $("passwordInput").value = "";
      $("passwordModal").classList.remove("hidden");
      $("passwordInput").focus();
    }

    function formatarMoeda(valor) {
      const n = Number(valor);
      return Number.isFinite(n) ? n.toLocaleString("pt-BR", {style:"currency", currency:"BRL"}) : "—";
    }

    function formatarQtd(valor) {
      const n = Number(valor);
      return Number.isFinite(n) ? n.toLocaleString("pt-BR", {maximumFractionDigits:4}) : String(valor ?? "");
    }

    // Aceita o link que sai do QR Code (/qrcode) e o link longo de consulta.
    // Sempre devolve o link longo, que é o formato exigido pelo Code.gs.
    function normalizarLinkNota(texto) {
      let url;
      try {
        url = new URL(String(texto || "").trim());
      } catch (_) {
        throw new Error("O QR Code não contém um endereço válido.");
      }

      const caminho = url.pathname.toLowerCase().replace(/\/$/, "");
      const caminhosAceitos = [
        "/qrcode",
        "/nfceconsultapublica/paginas/consultaqrcode.aspx"
      ];

      if (url.protocol !== "https:" ||
          url.hostname.toLowerCase() !== "www.nfce.fazenda.sp.gov.br" ||
          !caminhosAceitos.includes(caminho)) {
        throw new Error("Este QR Code não é de uma NFC-e da Fazenda de São Paulo.");
      }

      const p = url.searchParams.get("p");
      if (!p || !/^\d{44}(?:\||$)/.test(p)) {
        throw new Error("A chave de acesso de 44 dígitos não foi encontrada no QR Code.");
      }

      return URL_CONSULTA + "?p=" + encodeURIComponent(p);
    }

    function bloquearTela(ocupado) {
      processando = ocupado;
      $("startCamera").disabled = ocupado || iniciandoCamera;
      $("submitNote").disabled = ocupado;
      $("noteLink").disabled = ocupado;
      $("changePassword").disabled = ocupado;
    }

    function erroCamera(err) {
      const s = String((err && (err.name || err.message)) || err || "");
      if (/NotAllowed|PermissionDenied/i.test(s)) return "Autorize a câmera nas configurações do navegador e tente novamente.";
      if (/NotFound|DevicesNotFound/i.test(s)) return "Nenhuma câmera foi encontrada no celular.";
      if (/NotReadable|TrackStart/i.test(s)) return "A câmera está ocupada por outro aplicativo. Feche-o e tente novamente.";
      return "Não foi possível abrir a câmera. Verifique a permissão e a conexão HTTPS.";
    }

    async function encerrarCamera() {
      const instancia = scanner;
      scanner = null;
      if (instancia) {
        try { if (instancia.isScanning) await instancia.stop(); } catch (err) { console.warn(err); }
        try { instancia.clear(); } catch (err) { console.warn(err); }
      }
      $("cameraArea").style.display = "none";
      $("reader").replaceChildren();
      $("startCamera").disabled = processando;
    }

    async function abrirCamera() {
      if (processando || iniciandoCamera || scanner) return;
      if (!senha) { abrirSenha(); return; }
      if (!window.isSecureContext) { mensagem("Abra o site pelo endereço HTTPS do GitHub Pages para usar a câmera.", "error"); return; }
      if (typeof Html5Qrcode === "undefined") { mensagem("A biblioteca do QR Code não carregou. Verifique a internet e recarregue a página.", "error"); return; }

      iniciandoCamera = true;
      leituraRecebida = false;
      $("startCamera").disabled = true;
      $("result").classList.add("hidden");
      $("cameraArea").style.display = "block";
      mensagem("Abrindo câmera traseira...", "info");

      try {
        scanner = new Html5Qrcode("reader", {
          formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
          useBarCodeDetectorIfSupported: true,
          verbose: false
        });
        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 12,
            qrbox: (largura, altura) => {
              const lado = Math.min(300, Math.floor(Math.min(largura, altura) * 0.8));
              return { width: lado, height: lado };
            }
          },
          async (texto) => {
            if (leituraRecebida || processando) return;
            leituraRecebida = true;
            mensagem("QR Code lido!", "success");
            // Guardamos o texto original para facilitar uma nova tentativa.
            $("noteLink").value = texto.trim();
            await encerrarCamera();
            await lancarNota(texto);
          },
          () => {} // Ausência de QR Code em um frame é normal.
        );
        if (!leituraRecebida) mensagem("Câmera ligada. Centralize o QR Code no quadrado.", "info");
      } catch (err) {
        console.error(err);
        mensagem(erroCamera(err), "error");
        await encerrarCamera();
      } finally {
        iniciandoCamera = false;
        $("startCamera").disabled = processando;
      }
    }

    async function enviarMotor(acao, campos) {
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:\?.*)?$/.test(URL_DO_MOTOR)) {
        throw new Error("Cole o endereço de implantação do Apps Script em URL_DO_MOTOR, terminado em /exec.");
      }
      if (!senha) { abrirSenha(); throw new Error("Informe a senha antes de continuar."); }

      const controle = new AbortController();
      const temporizador = setTimeout(() => controle.abort(), 60000);
      let resposta;
      try {
        resposta = await fetch(URL_DO_MOTOR, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ senha, acao, link: campos.link || "", loja: campos.loja || "", categoria: campos.categoria || "" }),
          redirect: "follow",
          signal: controle.signal
        });
      } catch (err) {
        if (err.name === "AbortError") {
          throw new Error("A consulta demorou demais. Verifique a planilha antes de tentar novamente.");
        }
        throw new Error("Não foi possível ler a resposta do Apps Script. Pode ser um bloqueio de CORS do Google ou falha de rede. Confira a planilha antes de repetir.");
      } finally {
        clearTimeout(temporizador);
      }

      if (!resposta.ok) throw new Error("O Apps Script retornou HTTP " + resposta.status + ". Verifique a implantação.");
      let dados;
      try { dados = await resposta.json(); }
      catch (_) { throw new Error("O Apps Script não retornou um JSON válido."); }
      if (!dados || typeof dados !== "object") throw new Error("Resposta inválida do Apps Script.");

      if (dados.aviso === "Senha inválida") {
        senha = "";
        try { localStorage.removeItem(SENHA_STORAGE); } catch (_) {}
        abrirSenha();
      }
      return dados;
    }

    async function lancarNota(linkOriginal) {
      if (processando) return;
      let link;
      try {
        link = normalizarLinkNota(linkOriginal);
      } catch (err) {
        mensagem(err.message, "warning");
        return;
      }

      await encerrarCamera();
      $("result").classList.add("hidden");
      bloquearTela(true);
      mensagem("Buscando a nota...", "info");

      try {
        const nota = await enviarMotor("lancar", { link });
        const duplicada = nota.aviso === "Essa notinha já foi lançada";
        if (nota.ok || duplicada) {
          exibirCompra(nota);
          mensagem(nota.aviso || "Compra lançada com sucesso!", duplicada ? "warning" : "success");
        } else {
          mensagem(nota.aviso || "Não foi possível lançar a compra.", "error");
        }
      } catch (err) {
        console.error(err);
        mensagem(err.message || "Erro inesperado ao lançar a compra.", "error");
      } finally {
        bloquearTela(false);
      }
    }

    function exibirCompra(nota) {
      lojaAtual = String(nota.loja || "").trim();
      $("shopName").textContent = lojaAtual || "Loja não informada";
      $("purchaseDate").textContent = "Data da compra: " + (nota.data || "Não informada");
      $("purchaseTotal").textContent = formatarMoeda(nota.total);

      categoriaAnterior = CATEGORIAS.includes(nota.categoria) ? nota.categoria : "Outros";
      $("category").value = categoriaAnterior;
      $("category").disabled = !lojaAtual;
      $("categoryStatus").textContent = "";
      $("items").replaceChildren();

      const itens = Array.isArray(nota.itens) ? nota.itens : [];
      if (!itens.length) {
        const p = document.createElement("p");
        p.className = "hint";
        p.textContent = "Nenhum produto retornado.";
        $("items").appendChild(p);
      }
      itens.forEach(item => {
        const linha = document.createElement("div"); linha.className = "item";
        const esquerda = document.createElement("div");
        const nome = document.createElement("div"); nome.className = "item-name"; nome.textContent = item.descricao || "Produto";
        const detalhe = document.createElement("div"); detalhe.className = "item-detail";
        detalhe.textContent = formatarQtd(item.quantidade) + " " + (item.unidade || "un") + " × " + formatarMoeda(item.precoUnitario);
        esquerda.append(nome, detalhe);
        const total = document.createElement("div"); total.className = "item-total"; total.textContent = formatarMoeda(item.total);
        linha.append(esquerda, total);
        $("items").appendChild(linha);
      });
      $("result").classList.remove("hidden");
    }

    $("category").addEventListener("change", async () => {
      if (!lojaAtual || salvandoCategoria) return;
      const nova = $("category").value;
      if (nova === categoriaAnterior) return;
      salvandoCategoria = true;
      $("category").disabled = true;
      $("categoryStatus").textContent = "Salvando categoria...";
      try {
        const resposta = await enviarMotor("categoria", { loja: lojaAtual, categoria: nova });
        if (!resposta.ok) throw new Error(resposta.aviso || "Não foi possível mudar a categoria.");
        categoriaAnterior = nova;
        $("categoryStatus").textContent = "✓ Categoria atualizada!";
      } catch (err) {
        $("category").value = categoriaAnterior;
        $("categoryStatus").textContent = "Não foi possível confirmar a alteração.";
        mensagem(err.message, "error");
      } finally {
        salvandoCategoria = false;
        $("category").disabled = false;
      }
    });

    $("startCamera").addEventListener("click", abrirCamera);
    $("stopCamera").addEventListener("click", async () => {
      leituraRecebida = true;
      await encerrarCamera();
      mensagem("Câmera desligada.", "info");
    });
    $("linkForm").addEventListener("submit", async e => {
      e.preventDefault();
      if (!$("noteLink").value.trim()) {
        mensagem("Cole o link da notinha antes de lançar.", "warning");
        return;
      }
      await lancarNota($("noteLink").value);
    });
    $("changePassword").addEventListener("click", async () => {
      if (processando) return;
      await encerrarCamera();
      abrirSenha();
    });
    $("passwordForm").addEventListener("submit", e => {
      e.preventDefault();
      const nova = $("passwordInput").value;
      if (!nova.trim()) { $("passwordError").textContent = "Digite a senha."; return; }
      try { localStorage.setItem(SENHA_STORAGE, nova); }
      catch (_) { $("passwordError").textContent = "Não foi possível salvar a senha neste navegador."; return; }
      senha = nova;
      $("passwordModal").classList.add("hidden");
      mensagem("Senha salva neste celular.", "success");
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && scanner) { leituraRecebida = true; encerrarCamera(); }
    });
    window.addEventListener("pagehide", () => { if (scanner) encerrarCamera(); });

    try { senha = localStorage.getItem(SENHA_STORAGE) || ""; } catch (_) { senha = ""; }
    if (!senha) abrirSenha();
  </script>
</body>
</html>
